[tool.poetry]
name = "hotel-api"
version = "1.0.0"
description = "A hotel API"
authors = ["Elkana Maina <elisoft.engineer@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
alembic = "^1.13.2"
asyncpg = "^0.29.0"
databases = "^0.9.0"
fastapi = "^0.112.0"
passlib = "^1.7.4"
python-dotenv = "^1.0.1"
python-jose = "^3.3.0"
python-multipart = "^0.0.9"
pyyaml = "^6.0.1"
sqlalchemy = "^2.0.31"
uvicorn = "^0.30.4"
email-validator = "^2.2.0"
pillow = "^10.4.0"


[tool.poetry.group.dev.dependencies]
fastapi-standalone-docs = "^0.1.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
