[project]
name = "hotel-api"
version = "0.1.0"
description = "An asynchronous API for hotel management"
authors = [
    {name = "Elkana Maina",email = "elisoft.engineer@gmail.com"}
]
license = "proprietary"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic (>=1.18.5,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "databases (>=0.9.0,<0.10.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "alembic-postgresql-enum (>=1.10.0,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "typer (>=0.27.0,<0.28.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.1,<0.17.0)",
    "alchemist-shell @ file:///home/elkana/Dev/packages/alchemist-shell",
]

[tool.poetry.group.dev.dependencies]
alchemist-shell = {develop = true}

