[project]
name = "hotel-api"
version = "0.1.0"
description = "'An API for handling CRUD operations in a hotel environment'"
authors = [
    {name = "Elkana Maina",email = "elisoft.engineer@gmail.com"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "alembic (>=1.16.4,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "databases (>=0.9.0,<0.10.0)",
    "fastapi (>=0.116.1,<0.117.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "alembic-postgresql-enum (>=1.8.0,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "typer (>=0.16.0,<0.17.0)",
    "alchemist-shell (>=0.1.1,<0.2.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
fastapi-standalone-docs = "^0.2.0"
ruff = "^0.12.8"


[tool.poetry.dependencies]
